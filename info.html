<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon"
        href="./images/logo.jpg"
        type="image/x-icon">
    <title>WinTask | Info </title>
    <!-- bootstrap css cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />
    <!-- custom css -->
    <link rel="stylesheet"
        href="./css/style.css">
    <link rel="stylesheet"
        href="./css/info.css">
</head>

<body>
    <div>
        <!-- Navbar -->
        <nav class="bg-success">
            <div style="min-height: 90px;"
                class="container d-flex justify-content-between align-items-center">
                <div class="rounded-circle"
                    style="width: 75px; height: 75px;">
                    <a href="/"><img class="w-100 img-fluid rounded-circle"
                            src="./images/logo.jpg"
                            alt="logo"></a>
                </div>

                <div>
                    <ul class="d-flex gap-4 list-unstyled">
                        <li class="menu navLink"><a class="text-decoration-none fw-bold fs-6 text-white hover-zoom"
                                href="/">Home</a></li>
                        <li class="menu navLink"><a class="text-decoration-none fw-bold fs-6 text-white hover-zoom"
                                href="info.html">Info.</a></li>
                        <li class="menu navLink"><a class="text-decoration-none fw-bold fs-6 text-white hover-zoom"
                                href="./about.html">About</a></li>
                        <li class="menu navLink"><a class="text-decoration-none fw-bold fs-6 text-white hover-zoom"
                                href="./users.html">All User</a></li>
                        <li class="menu navLink"><a class="text-decoration-none fw-bold fs-6 text-white hover-zoom"
                                href="./profile.html">Profile</a></li>
                        <li class="menu navLinkAuth"><a class="text-decoration-none fw-bold fs-6 text-white hover-zoom"
                                href="./signup.html">Signup</a></li>
                        <li class="menu navLinkAuth"><a class="text-decoration-none fw-bold fs-6 text-white hover-zoom"
                                href="./login.html">Login</a></li>
                    </ul>
                </div>
            </div>

        </nav>
        <!-- Navbar end -->
        <div class="container mt-5">
            <div class="d-flex justify-content-between">
                <h2 class="mb-4">Alumni Contribution Table</h2>
                <button class="btn btn-success btn-sm btn-custom"
                    data-bs-toggle="modal"
                    data-bs-target="#dataModal">Insert New</button>
            </div>
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Full Name</th>
                        <th>Department</th>
                        <th>Batch</th>
                        <th>Contribution</th>
                        <th>Hobbies</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="alumniTable">
                    <!-- Table body is created under fetched alumnus data -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Insert and Update form Dialog Box -->
    <!-- Modal -->
    <div class="modal fade"
        id="dataModal"
        tabindex="-1"
        aria-labelledby="modalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"
                        id="modalLabel">Add / Update Contribution</h5>
                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="alumniForm">
                        <input type="hidden"
                            id="_id">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Enter full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text"
                                id="department"
                                class="form-control"
                                placeholder="Enter department">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Batch</label>
                            <input id="batchNo"
                                type="text"
                                class="form-control"
                                placeholder="Enter batch">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contribution</label>
                            <input id="contribution"
                                type="text"
                                class="form-control"
                                placeholder="Enter contribution amount">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hobbies</label>
                            <textarea id="hobbies"
                                class="form-control"
                                placeholder="Enter Your Hobbies"></textarea>
                        </div>
                        <button type="submit"
                            class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/info.js"></script>
</body>

</html>
